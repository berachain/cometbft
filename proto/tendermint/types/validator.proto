syntax = "proto3";
package tendermint.types;

import "gogoproto/gogo.proto";
import "tendermint/crypto/keys.proto";

option go_package = "github.com/cometbft/cometbft/proto/tendermint/types";

// BlockIdFlag indicates which BlockID the signature is for
enum BlockIDFlag {
  option (gogoproto.goproto_enum_stringer) = true;
  option (gogoproto.goproto_enum_prefix) = false;

  BLOCK_ID_FLAG_UNKNOWN = 0 [(gogoproto.enumvalue_customname) = "BlockIDFlagUnknown"]; // indicates an error condition
  BLOCK_ID_FLAG_ABSENT = 1 [(gogoproto.enumvalue_customname) = "BlockIDFlagAbsent"]; // the vote was not received
  BLOCK_ID_FLAG_COMMIT = 2 [(gogoproto.enumvalue_customname) = "BlockIDFlagCommit"]; // voted for the block that received the majority
  BLOCK_ID_FLAG_NIL = 3 [(gogoproto.enumvalue_customname) = "BlockIDFlagNil"]; // voted for nil

  // Aggregated commit
  // Voted for the block and contains aggregated signature.
  BLOCK_ID_FLAG_AGG_COMMIT = 4 [(gogoproto.enumvalue_customname) = "BlockIDFlagAggCommit"];
  // Voted for the block.
  BLOCK_ID_FLAG_AGG_COMMIT_ABSENT = 5 [(gogoproto.enumvalue_customname) = "BlockIDFlagAggCommitAbsent"];
  // Voted for nil and contains aggregated signature.
  BLOCK_ID_FLAG_AGG_NIL = 6 [(gogoproto.enumvalue_customname) = "BlockIDFlagAggNil"];
  // Voted for nil.
  BLOCK_ID_FLAG_AGG_NIL_ABSENT = 7 [(gogoproto.enumvalue_customname) = "BlockIDFlagAggNilAbsent"];
}

message ValidatorSet {
  repeated Validator validators = 1;
  Validator proposer = 2;
  int64 total_voting_power = 3;
}

message Validator {
  bytes address = 1;
  // NOTE(berachain): bera-v1.x serializes keys via pub_key_bytes/pub_key_type
  // (the v1.x layout); pub_key is kept as a decode fallback only.
  tendermint.crypto.PublicKey pub_key = 2 [deprecated = true];
  int64 voting_power = 3;
  int64 proposer_priority = 4;
  bytes pub_key_bytes = 5;
  string pub_key_type = 6;
}

message SimpleValidator {
  tendermint.crypto.PublicKey pub_key = 1;
  int64 voting_power = 2;
}
