version: v1
name: buf.build/tendermint/tendermint
deps:
  - buf.build/cosmos/gogo-proto
breaking:
  use:
    - FILE
  ignore:
    # Intentional wire-format changes from the bera re-fork (PR #51):
    # CanonicalVote drops the timestamp field and ConsensusParams replaces
    # authority with synchrony to align with bera-v1.x.
    - tendermint/types/canonical.proto
    - tendermint/types/params.proto
lint:
  use:
    - BASIC
    - FILE_LOWER_SNAKE_CASE
    - UNARY_RPC
